
name: CI and NuGet

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, Test and Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Oeeng.AiChat.slnx

      - name: Build
        run: dotnet build Oeeng.AiChat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Oeeng.AiChat.Tests/Oeeng.AiChat.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName!~CreateAsync_GeneralQuestion_ShouldContainParis"

      - name: Pack
        run: dotnet pack Oeeng.AiChat/Oeeng.AiChat.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: build-test-pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: OEENG

      - name: Publish to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

name: CI and NuGet

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Oeeng.AiChat.slnx

      - name: Build
        run: dotnet build Oeeng.AiChat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Oeeng.AiChat.Tests/Oeeng.AiChat.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName!~CreateAsync_GeneralQuestion_ShouldContainParis"

      - name: Pack
        run: dotnet pack Oeeng.AiChat/Oeeng.AiChat.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
